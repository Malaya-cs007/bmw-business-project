
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Plant Spartanburg - ERP & Catalog Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Custom External Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bmw: {
                            navy: '#06132b',
                            dark: '#0b1e3d',
                            card: '#11284d',
                            blue: '#1C69D2',
                            lightBlue: '#4A90E2',
                            silver: '#E0E6ED',
                            accent: '#7097D1',
                            red: '#E53E3E',
                            green: '#38A169',
                            amber: '#D69E2E'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bmw-navy text-slate-100 font-sans antialiased bg-grid-pattern min-h-screen flex flex-col selection:bg-bmw-blue selection:text-white">

    <!-- TOP NAVIGATION HEADER (SHARED ACROSS ALL PAGES) -->
    <header class="sticky top-0 z-50 bg-bmw-navy/90 backdrop-blur-md border-b border-bmw-blue/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                
                <!-- BMW Logo & Branding -->
                <button onclick="navigatePage('page1')" class="flex items-center space-x-4 text-left focus:outline-none">
                    <div class="w-12 h-12 rounded-full border-2 border-slate-300 flex items-center justify-center bg-gradient-to-tr from-slate-900 via-bmw-blue to-slate-100 shadow-md">
                        <span class="font-tech text-xs font-black text-white tracking-tighter">BMW</span>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h1 class="font-tech text-lg sm:text-xl font-bold tracking-wider text-white">PLANT SPARTANBURG</h1>
                            <span class="bg-bmw-blue/30 text-bmw-accent text-xs font-semibold px-2 py-0.5 rounded border border-bmw-blue/40">ERP 2.0</span>
                        </div>
                        <p class="text-xs text-slate-400">Production Management System</p>
                    </div>
                </button>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex space-x-6 text-sm font-medium">
                    <button onclick="navigatePage('page1')" id="nav-page1" class="nav-btn text-bmw-lightBlue border-b-2 border-bmw-blue font-semibold py-1 transition-colors">Home (ERP Overview)</button>
                    <button onclick="navigatePage('page2')" id="nav-page2" class="nav-btn text-slate-300 hover:text-bmw-lightBlue py-1 transition-colors">Products &amp; Services</button>
                    <button onclick="navigatePage('page3')" id="nav-page3" class="nav-btn text-slate-300 hover:text-bmw-lightBlue py-1 transition-colors">About Us &amp; Contact</button>
                </nav>

                <!-- Mobile Menu Toggle Button -->
                <button id="mobileMenuBtn" class="md:hidden text-slate-300 hover:text-white focus:outline-none p-2">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Nav -->
        <div id="mobileMenu" class="hidden md:hidden bg-bmw-dark border-b border-bmw-blue/30 px-4 pt-2 pb-4 space-y-2">
            <button onclick="navigatePage('page1')" class="block w-full text-left text-slate-300 hover:text-bmw-blue py-2 border-b border-slate-800">Home (ERP Overview)</button>
            <button onclick="navigatePage('page2')" class="block w-full text-left text-slate-300 hover:text-bmw-blue py-2 border-b border-slate-800">Products &amp; Services</button>
            <button onclick="navigatePage('page3')" class="block w-full text-left text-slate-300 hover:text-bmw-blue py-2">About Us &amp; Contact</button>
        </div>
    </header>

    <!-- ================= PAGE 1 VIEW (INDEX.HTML) ================= -->
    <div id="page1" class="page-view active">
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-16">
            <!-- (Main content sections remain unchanged) -->
        </main>
    </div>

    <!-- Additional page views/footer and scripts omitted for brevity in snippet view, keeping full file structure in your repository -->
</body>
</html>
